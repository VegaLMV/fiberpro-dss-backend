<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>FiberPro DSS - Acceso Seguro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --bg-dark: #0f172a; /* Azul corporativo idéntico al sidebar del layout */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        /* Estilo Premium para la Tarjeta */
        .card-premium {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Texto Gradiente Corporativo */
        .brand-logo {
            background: linear-gradient(45deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Inputs Personalizados */
        .form-control-premium {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-control-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        /* Ajuste del Label Flotante */
        .form-floating > label {
            padding-left: 1.25rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Botón Interactivo */
        .btn-login {
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="card card-premium p-4 p-sm-5">

        <div class="text-center mb-4 pb-2">
            <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3 shadow-sm" style="width: 75px; height: 75px;">
                <i class="bi bi-hdd-network-fill text-primary" style="font-size: 2.5rem;"></i>
            </div>
            <h3 class="brand-logo mb-1">FiberPro DSS</h3>
            <p class="text-muted small fw-medium">Autenticación Corporativa</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center border-0 border-start border-danger border-4 shadow-sm" role="alert">
            <i class="bi bi-shield-x-fill fs-4 me-3 text-danger"></i>
            <div class="small fw-medium">Acceso denegado. Verifique sus credenciales de SQL Server.</div>
        </div>

        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center border-0 border-start border-success border-4 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-3 text-success"></i>
            <div class="small fw-medium">Sesión cerrada de forma segura.</div>
        </div>

        <form th:action="@{/auth/procesar-login}" method="POST">

            <div class="form-floating mb-3">
                <input type="text" class="form-control form-control-premium" id="username" name="username" placeholder="Usuario" required autocomplete="off">
                <label for="username"><i class="bi bi-person-fill me-2 text-muted"></i>Usuario</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" class="form-control form-control-premium" id="password" name="password" placeholder="Contraseña" required>
                <label for="password"><i class="bi bi-lock-fill me-2 text-muted"></i>Contraseña</label>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">
                Ingresar al Sistema <i class="bi bi-arrow-right-circle ms-2"></i>
            </button>

        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <small class="text-muted" style="font-size: 0.75rem;">
                <i class="bi bi-shield-lock-fill me-1 text-primary"></i> Conexión cifrada al motor de base de datos
            </small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
</body>
</html>
