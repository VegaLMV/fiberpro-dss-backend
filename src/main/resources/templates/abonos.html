<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Finanzas - Abonos</title></head>
<body>
<div layout:fragment="content" th:fragment="content">
    <style>
        .slide-in { animation: slideIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; opacity: 0; transform: translateX(-20px); }
        .slide-in-right { animation: slideInRight 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; opacity: 0; transform: translateX(20px); animation-delay: 0.1s; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }
        
        .pos-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #fff; }
        .pos-header { background: linear-gradient(135deg, #198754, #20c997); color: white; border-radius: 15px 15px 0 0; padding: 25px; }
        
        .amount-input { font-size: 3rem !important; font-weight: 700; color: #198754; height: auto !important; text-align: right; padding: 10px 20px !important; background-color: #f8f9fa; }
        .amount-input:focus { box-shadow: none; border-color: #198754; background-color: #fff; }
        .currency-symbol { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 2.2rem; color: #6c757d; z-index: 5; }
    </style>

    <div class="container-fluid">
        <h3 class="fw-bold mb-4 text-dark slide-in"><i class="bi bi-currency-dollar text-success me-2"></i>Caja y Pagos</h3>
        
        <div class="row g-4">
            <!-- Formulario Punto de Venta (POS) -->
            <div class="col-12 col-lg-5 col-xl-4 slide-in">
                <div class="card pos-card h-100">
                    <div class="pos-header text-center">
                        <i class="bi bi-cash-stack display-4 opacity-75"></i>
                        <h4 class="mt-2 fw-bold mb-0">Registrar Abono</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/finanzas/abonos/guardar}" method="POST" class="needs-validation" novalidate>
                            
                            <!-- Multi-Tenancy Crítico -->
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark"><i class="bi bi-server me-1"></i>Entorno de Base de Datos</label>
                                <select name="baseDatosDestino" class="form-select border-2 border-success shadow-sm" required>
                                    <option value="" selected disabled>Seleccione BD...</option>
                                    <option value="db_econo">db_econo</option>
                                    <option value="db_conexiondigital">db_conexiondigital</option>
                                </select>
                                <div class="invalid-feedback">Obligatorio.</div>
                            </div>

                            <div class="mb-4 position-relative">
                                <label class="form-label fw-bold text-dark">Importe Total</label>
                                <div class="position-relative">
                                    <span class="currency-symbol">$</span>
                                    <input type="number" step="0.01" class="form-control amount-input rounded-3" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idAbonado" placeholder="ID" required>
                                        <label for="idAbonado"><i class="bi bi-upc-scan me-1"></i>ID Abonado (Documento)</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="concepto" placeholder="Concepto" required>
                                        <label for="concepto"><i class="bi bi-card-text me-1"></i>Concepto del Pago</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-floating">
                                        <input type="month" class="form-control" id="periodo" required>
                                        <label for="periodo">Periodo</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="estadoPago" required>
                                            <option value="Completado">Completado</option>
                                            <option value="Pendiente">Pendiente</option>
                                        </select>
                                        <label for="estadoPago">Estado</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow mt-3 rounded-3">
                                Procesar Pago <i class="bi bi-check-circle-fill ms-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla Pagos Recientes -->
            <div class="col-12 col-lg-7 col-xl-8 slide-in-right">
                <div class="card border-0 rounded-4 shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold text-secondary m-0"><i class="bi bi-receipt-cutoff me-2"></i>Transacciones del Día</h5>
                        <button class="btn btn-sm btn-outline-success rounded-pill"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
                    </div>
                    <div class="card-body p-0 mt-2">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Ticket</th>
                                        <th>Abonado ID</th>
                                        <th>Periodo</th>
                                        <th>Instancia BD</th>
                                        <th class="text-end">Importe</th>
                                        <th class="text-center pe-4">Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="ps-4 text-muted">#TXN-9021</td>
                                        <td class="fw-semibold">AB-4059</td>
                                        <td>Mayo 2026</td>
                                        <td><span class="badge bg-primary rounded-pill">db_econo</span></td>
                                        <td class="text-end fw-bold text-success">$45.00</td>
                                        <td class="text-center pe-4"><i class="bi bi-check-circle-fill text-success fs-5" title="Completado"></i></td>
                                    </tr>
                                    <tr>
                                        <td class="ps-4 text-muted">#TXN-9020</td>
                                        <td class="fw-semibold">AB-1102</td>
                                        <td>Mayo 2026</td>
                                        <td><span class="badge bg-info text-dark rounded-pill">db_conexiondigital</span></td>
                                        <td class="text-end fw-bold text-success">$60.50</td>
                                        <td class="text-center pe-4"><i class="bi bi-check-circle-fill text-success fs-5" title="Completado"></i></td>
                                    </tr>
                                    <tr>
                                        <td class="ps-4 text-muted">#TXN-9019</td>
                                        <td class="fw-semibold">AB-8834</td>
                                        <td>Abril 2026</td>
                                        <td><span class="badge bg-primary rounded-pill">db_econo</span></td>
                                        <td class="text-end fw-bold text-dark">$30.00</td>
                                        <td class="text-center pe-4"><i class="bi bi-clock-fill text-warning fs-5" title="Pendiente"></i></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Validación -->
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</div>
</body>
</html>
