<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>FiberPro DSS - Panel Administrativo</title>

    <!-- Fuentes e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- PATRÓN DE DISEÑO GLOBAL (Heredado por todas las vistas) -->
    <style>
        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --sidebar-bg: #0f172a; /* Azul corporativo muy oscuro */
            --sidebar-hover: #1e293b;
            --bg-body: #f1f5f9; /* Gris pizarra ultra claro */
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Scrollbar Corporativo */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Contenedor Dinámico con Animación de Entrada */
        .main-content {
            animation: fadeUp 0.5s ease-out forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CLASES GLOBALES PARA LAS VISTAS (CRUD) --- */
        .card-premium {
            border: none;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.3s ease;
        }
        .card-premium:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }
        .card-header-premium {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            padding: 1.25rem 1.5rem;
        }
        .table-premium th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
        }
        .table-premium td {
            vertical-align: middle;
            color: var(--text-dark);
            border-bottom: 1px solid #f1f5f9;
        }
        .form-select-premium, .form-control-premium {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: none;
            transition: all 0.2s;
        }
        .form-control-premium:focus, .form-select-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        /* --- DISEÑO DEL SIDEBAR DERECHO --- */
        .sidebar-wrapper {
            background: linear-gradient(180deg, var(--sidebar-bg) 0%, #000000 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }
        .brand-logo {
            background: linear-gradient(45deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .nav-link-custom {
            display: flex;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 0.3rem;
            border: 1px solid transparent;
        }
        .nav-link-custom i {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }
        .nav-link-custom:hover {
            background-color: var(--sidebar-hover);
            color: #ffffff;
            transform: translateX(-4px);
        }
        .nav-link-custom:hover i {
            transform: scale(1.1);
            color: var(--primary);
        }
        .nav-link-custom.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: #ffffff;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .nav-link-custom.active i {
            color: #3b82f6;
        }
        .user-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
        }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- ÁREA DINÁMICA (Izquierda / Centro) -->
        <div class="col-12 col-md-10 vh-100 overflow-auto p-4 p-md-5 main-content">
            <!-- Aquí se inyectarán las demás pantallas usando Thymeleaf -->
            <div layout:fragment="content">
            </div>
        </div>

        <!-- PANEL LATERAL (Derecha) -->
        <div class="col-12 col-md-2 vh-100 shadow-lg d-flex flex-column p-3 position-sticky top-0 sidebar-wrapper">

            <!-- Logo -->
            <div class="d-flex align-items-center justify-content-center mb-5 mt-3 px-2">
                <i class="bi bi-hdd-network-fill fs-3 text-primary me-2"></i>
                <h4 class="m-0 brand-logo">FiberPro DSS</h4>
            </div>

            <!-- Menú de Navegación -->
            <nav class="d-flex flex-column mb-auto gap-1">
                <a th:href="@{/layout}" class="nav-link-custom active">
                    <i class="bi bi-grid-1x2-fill me-3"></i> Dashboard
                </a>
                <a th:href="@{/clientes/abonados/registrar}" class="nav-link-custom">
                    <i class="bi bi-people-fill me-3"></i> Abonados
                </a>
                <a th:href="@{/operaciones/incidencias/registrar}" class="nav-link-custom">
                    <i class="bi bi-tools me-3"></i> Operaciones
                </a>
                <a th:href="@{/finanzas/abonos/registrar}" class="nav-link-custom">
                    <i class="bi bi-currency-dollar me-3"></i> Finanzas
                </a>
                <a th:href="@{/nomina/registrar}" class="nav-link-custom">
                    <i class="bi bi-file-earmark-person-fill me-3"></i> Nómina
                </a>
            </nav>

            <!-- Perfil y Cierre de Sesión -->
            <div class="user-card mt-auto text-center">
                <div class="d-flex align-items-center justify-content-center mb-3">
                    <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white me-2" style="width: 35px; height: 35px;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="text-start">
                        <span class="d-block fw-bold text-white lh-1 text-truncate" style="max-width: 100px;" th:text="${session.usuarioLogueado}">Admin</span>
                        <small class="text-muted" style="font-size: 0.75rem;">Conectado</small>
                    </div>
                </div>

                <a th:href="@{/auth/logout}" class="btn btn-outline-danger w-100 fw-bold border-2 rounded-3 d-flex justify-content-center align-items-center">
                    <i class="bi bi-box-arrow-right me-2"></i> Salir
                </a>
            </div>

        </div>

    </div>
</div>

<!-- Scripts Esenciales -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script de Seguridad: Manejo de Historial no intrusivo -->
<script>
    // Este script previene retroceder a la página de login sin romper los clics en el menú
    window.history.pushState(null, "", window.location.href);
    window.addEventListener('popstate', function () {
        window.history.pushState(null, "", window.location.href);
    });
</script>
</body>
</html>
