<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FiberPro DSS - Interfaz Corporativa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --sidebar-bg: #0b1120; /* Azul noche profundo */
            --sidebar-hover: #1e293b;
            --bg-body: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            overflow-x: hidden;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* --- ANIMACIÓN CONTENIDO --- */
        .main-content { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SIDEBAR IZQUIERDO PREMIUM --- */
        .sidebar-wrapper {
            background: var(--sidebar-bg);
            background-image: radial-gradient(circle at top right, rgba(13, 110, 253, 0.1), transparent 40%);
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        .brand-logo {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            font-weight: 700;
            margin-bottom: 0.5rem;
            padding-left: 1rem;
        }

        /* Botones de Módulo */
        .nav-link-custom {
            display: flex;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 0.4rem;
        }
        .nav-link-custom i {
            font-size: 1.25rem;
            margin-right: 12px;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .nav-link-custom:hover {
            background-color: rgba(255,255,255,0.05);
            color: #ffffff;
            transform: translateX(4px);
        }
        .nav-link-custom:hover i { color: #60a5fa; transform: scale(1.1); }

        .nav-link-custom.active {
            background: linear-gradient(90deg, rgba(13, 110, 253, 0.15) 0%, transparent 100%);
            color: #ffffff;
            border-left: 4px solid var(--primary);
        }
        .nav-link-custom.active i { color: #3b82f6; }

        /* Tarjeta de Usuario */
        .user-profile-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            transition: background 0.2s;
        }
        .user-profile-card:hover { background: rgba(255, 255, 255, 0.08); }

        .btn-logout {
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #fca5a5;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: #dc3545; color: #fff; border-color: #dc3545; }

    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <div class="col-12 col-md-2 vh-100 d-flex flex-column p-3 position-sticky top-0 sidebar-wrapper shadow-lg">

            <div class="d-flex align-items-center mb-4 mt-2 px-2">
                <div class="bg-primary bg-gradient rounded-3 p-2 me-2 shadow d-flex align-items-center justify-content-center">
                    <i class="bi bi-hdd-network-fill text-white fs-5"></i>
                </div>
                <h4 class="m-0 brand-logo">FiberPro DSS</h4>
            </div>

            <nav class="d-flex flex-column mb-auto mt-2">
                <div class="nav-label">General</div>
                <a th:href="@{/layout}" class="nav-link-custom" id="nav-dashboard">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>

                <div class="nav-label mt-3">Módulos Core</div>
                <a th:href="@{/clientes/abonados/registrar}" class="nav-link-custom" id="nav-abonados">
                    <i class="bi bi-people-fill"></i> Abonados
                </a>
                <a th:href="@{/operaciones/ordenes/registrar}" class="nav-link-custom" id="nav-operaciones">
                    <i class="bi bi-tools"></i> Operaciones
                </a>
                <a th:href="@{/finanzas/abonos/registrar}" class="nav-link-custom" id="nav-finanzas">
                    <i class="bi bi-currency-dollar"></i> Finanzas
                </a>
                <a th:href="@{/nomina/registrar}" class="nav-link-custom" id="nav-nomina">
                    <i class="bi bi-person-vcard-fill"></i> Nómina
                </a>
            </nav>

            <div class="mt-auto border-top border-secondary border-opacity-25 pt-3">

                <div class="user-profile-card d-flex align-items-center mb-3">
                    <div class="bg-primary bg-gradient rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0 shadow-sm" style="width: 42px; height: 42px;">
                        <i class="bi bi-person-fill fs-5"></i>
                    </div>
                    <div class="ms-3 overflow-hidden text-start w-100">
                        <div class="fw-bold text-white text-truncate" style="font-size: 0.9rem;" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado : 'Admin Local'}">
                            Usuario
                        </div>
                        <div class="d-flex align-items-center">
                            <span class="spinner-grow spinner-grow-sm text-success me-1" style="width: 8px; height: 8px; animation-duration: 2s;" role="status"></span>
                            <small class="text-success fw-medium" style="font-size: 0.75rem;">Conectado</small>
                        </div>
                    </div>
                </div>

                <a th:href="@{/auth/logout}" class="btn btn-logout w-100 rounded-3 d-flex justify-content-center align-items-center fw-bold py-2">
                    <i class="bi bi-box-arrow-left me-2"></i> Cerrar Sesión
                </a>
            </div>

        </div>

        <div class="col-12 col-md-10 vh-100 overflow-auto p-4 p-md-5 main-content bg-body">
            <div layout:fragment="content">
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const path = window.location.pathname;

        // Quita la clase activa de todos
        document.querySelectorAll('.nav-link-custom').forEach(el => el.classList.remove('active'));

        // Aplica la clase activa al módulo correspondiente
        if(path.includes('/clientes/abonados')) document.getElementById('nav-abonados').classList.add('active');
        // CORREGIDO: Lógica de Javascript actualizada para iluminar el botón en la nueva ruta
        else if(path.includes('/operaciones/ordenes')) document.getElementById('nav-operaciones').classList.add('active');
        else if(path.includes('/finanzas/abonos')) document.getElementById('nav-finanzas').classList.add('active');
        else if(path.includes('/nomina')) document.getElementById('nav-nomina').classList.add('active');
        else document.getElementById('nav-dashboard').classList.add('active');
    });
</script>

<script>
    window.history.pushState(null, "", window.location.href);
    window.addEventListener('popstate', function () {
        window.history.pushState(null, "", window.location.href);
    });
</script>
</body>
</html>
